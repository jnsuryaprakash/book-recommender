[project]
name = "book-recommender"
version = "0.2.0"
description = "Personal book recommender — your next 100 nonfiction reads from any OverDrive/Libby library, curated by Claude against your own reading history."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "selectolax>=0.3.21",
    "rapidfuzz>=3.9",
    "numpy>=1.26",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "anthropic>=0.40",
    "jinja2>=3.1",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
    "tenacity>=9.0",
    "truststore>=0.10",
    "Pillow>=11.0",
]

[tool.setuptools]
packages = []
